<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Registration</title>
</head>

<body>

    <header>
        <h1>Event Registration Form</h1>
    </header>

    <main>
        <form action="#" method="post">

            <label for="name">Full Name:</label><br>
            <input type="text" id="name" name="name" required>
            <br><br>

            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email" required>
            <br><br>

            <label for="phone">Phone Number:</label><br>
            <input type="tel" id="phone" name="phone" required>
            <br><br>

            <label for="date">Preferred Event Date:</label><br>
            <input type="date" id="date" name="date" required>
            <br><br>

            
                <legend>choose one</legend>

                <input type="radio" id="general" name="ticket" value="general" required>
                <label for="general">universty</label><br>

                <input type="radio" id="vip" name="ticket" value="vip">
                <label for="vip">school</label>
    

            <br>

            
            <br><br>

            <button type="submit">submit</button>

        </form>
    </main>

</body>
</html>
