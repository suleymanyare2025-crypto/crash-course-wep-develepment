<form id="feedback-form" novalidate>
  <div>
    <label for="name">Name <span aria-hidden="true">*</span></label>
    <input
      type="text"
      id="name"
      name="name"
      autocomplete="name"
      required
      aria-describedby="name-error"
    >
    <p id="name-error" role="alert"></p>
  </div>

  <div>
    <label for="email">Email <span aria-hidden="true">*</span></label>
    <input
      type="email"
      id="email"
      name="email"
      autocomplete="email"
      required
      aria-describedby="email-error"
    >
    <p id="email-error" role="alert"></p>
  </div>

  <fieldset>
    <legend>How satisfied are you with our website?</legend>

    <div>
      
      <label for="very-satisfied">Very satisfied</label>
    </div>

    <div>
      
      <label for="satisfied">Satisfied</label>
    </div>

    <div>
      
      <label for="neutral">Neither satisfied nor dissatisfied</label>
    </div>

    <div>
      
      <label for="dissatisfied">Dissatisfied</label>
    </div>

    <div>
     
      <label for="very-dissatisfied">Very dissatisfied</label>
    </div>

    <p id="satisfaction-error" role="alert"></p>
  </fieldset>

  <div>
    <label for="comments">
      Comments <span aria-hidden="true">*</span>
     </label><br><br>

    <textarea
      id="comments"
      name="comments"
      minlength="10"
      maxlength="1000"
    ></textarea> 

    <p id="comments-help">
      Please enter between 10 and 1000 characters.
    </p>

    <p id="comments-error" role="alert"></p>
  </div>

  <button type="submit">Submit</button>

  <p id="form-status" role="status" aria-live="polite"></p>
</form>
</html>
